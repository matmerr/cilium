apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipam-churn
  namespace: default
  labels:
    app: ipam-churn
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ipam-churn
  template:
    metadata:
      labels:
        app: ipam-churn
    spec:
      containers:
        - name: agnhost
          image: registry.k8s.io/e2e-test-images/agnhost:2.39
          command: ["/agnhost", "pause"]
      tolerations:
        - operator: Exists
      terminationGracePeriodSeconds: 0
