apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ciliumtestipams.test.cilium.io
spec:
  group: test.cilium.io
  names:
    kind: CiliumTestIPAM
    listKind: CiliumTestIPAMList
    plural: ciliumtestipams
    singular: ciliumtestipam
    shortNames:
      - ctipam
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Subnet
          type: string
          jsonPath: .spec.subnet
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - subnet
              properties:
                subnet:
                  type: string
                  description: "Overall IPv4 CIDR for node subnet allocation (e.g. 10.244.0.0/16)"
                ipv6Subnet:
                  type: string
                  description: "Reserved for future IPv6 support"
            status:
              type: object
              properties:
                nodes:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      subnet:
                        type: string
                        description: "/24 CIDR assigned to this node"
                      gateway:
                        type: string
                        description: "Gateway IP (always .1 of the node subnet)"
                      capacity:
                        type: integer
                        description: "Total usable IPs (253 for a /24)"
